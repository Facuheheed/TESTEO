[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dotcut-studio"
version = "0.1.0"
description = "Automated video silence cutter MVP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Codex"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
dotcut = "dotcut.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
